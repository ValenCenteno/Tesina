<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        <nav class="nav-links" id="navLinks">
            <a href="../html/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/register.html" class="btn btn-primary">Registrarse</a>
        </nav>
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Iniciá sesión para reportar problemas urbanos</p>
            </div>
            <div class="login-body">
                <div id="alertContainer"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required
                               placeholder="Ingresá tu usuario" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required
                               placeholder="Ingresá tu contraseña" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                </form>
                <div class="login-footer">
                    <p>¿No tenés cuenta? <a href="register.html">Registrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    // Hamburger menu
    const hamburger = document.getElementById('hamburger');
    const navLinks  = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        const icon = hamburger.querySelector('i');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
    });
</script>
</body>
</html>
