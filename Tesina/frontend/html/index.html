<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Inicio</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/index.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        
        <!-- Menú de navegación para desktop y mobile -->
        <nav class="nav-links" id="navLinks">
            <a href="../htm/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/crear-reporte.html" class="btn btn-outline">Reportar</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/admin.html" class="btn btn-outline">Admin</a>
            <button class="btn btn-outline" id="loginBtn">Iniciar Sesión</button>
            <button class="btn btn-primary" id="registerBtn">Registro</button>
        </nav>
        
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main class="container">
    <section class="hero">
        <div class="hero-content">
            <h1>Reporta problemas en Rio Tercero</h1>
            <p class="hero-subtitle">Ayudá a mejorar la ciudad reportando problemas urbanos</p>
            <div class="hero-buttons">
                <a href="../html/crear-reporte.html" class="btn btn-primary btn-large">Crear Reporte</a>
                <a href="../html/mapa.html" class="btn btn-outline btn-large">Ver Mapa</a>
            </div>
        </div>
    </section>

    <section>
        <div class="section-header">
            <h2>Problemas recientes</h2>
            <a href="../html/mapa.html" class="view-all">Ver todos</a>
        </div>
        <div class="problems-grid" id="recentProblems"></div>
    </section>
</main>

<script src="../js/api.js"></script>
<script src="../js/home.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/menu.js"></script>


<script>
    // Menú hamburguesa completamente funcional
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        
        // Cambiar ícono del hamburger
        const icon = hamburger.querySelector('i');
        if (navLinks.classList.contains('active')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
        } else {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }
    });

    // Cerrar menú al hacer clic en un enlace (mejor UX)
    const navItems = navLinks.querySelectorAll('a, button');
    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navLinks.classList.remove('active');
            const icon = hamburger.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        });
    });

    // Cerrar menú al hacer clic fuera de él
    document.addEventListener('click', (event) => {
        if (!hamburger.contains(event.target) && !navLinks.contains(event.target)) {
            navLinks.classList.remove('active');
            const icon = hamburger.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }
    });
</script>
</body>
</html>
