<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiudadActiva</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/index.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>

        <div class="nav-buttons">
            <button class="btn btn-outline" onclick="showPage('home')">Inicio</button>
            <button class="btn btn-outline" onclick="showPage('create-report')">Reportar</button>
            <button class="btn btn-outline" onclick="showPage('reports-map')">Mapa</button>
            <button class="btn btn-outline" onclick="showPage('admin-dashboard')">Admin</button>
            <button class="btn btn-outline" id="loginBtn">Iniciar Sesión</button>
            <button class="btn btn-primary" id="registerBtn">Resgistro</button>
        </div>

        <button class="btn-mobile-toggle" id="mobileToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<!-- MOBILE NAV -->
<div class="mobile-nav-overlay" id="mobileNav">
    <div class="mobile-nav-content">
        <button onclick="showPage('home')">Inicio</button>
        <button onclick="showPage('create-report')">Reportar</button>
        <button onclick="showPage('reports-map')">Mapa</button>
        <button onclick="showPage('admin-dashboard')">Admin</button>
    </div>
</div>

<!-- PAGES -->
<div class="page-container container">

    <!-- HOME -->
    <div id="home" class="page active">
        <section class="hero">
            <div class="hero-content">
                <h1>Reporta problemas en Rio Tercero</h1>
                <p class="hero-subtitle">Ayudá a mejorar la ciudad reportando problemas urbanos</p>

                <div class="hero-buttons">
                    <button class="btn btn-primary btn-large" onclick="showPage('create-report')">
                        Crear Reporte
                    </button>
                    <button class="btn btn-outline btn-large" onclick="showPage('reports-map')">
                        Ver Mapa
                    </button>
                </div>
            </div>
        </section>

        <section>
            <div class="section-header">
                <h2>Problemas recientes</h2>
                <a href="#" class="view-all" onclick="showPage('reports-map')">Ver todos</a>
            </div>

            <div class="problems-grid" id="recentProblems"></div>
        </section>
    </div>

    <!-- CREATE REPORT -->
    <div id="create-report" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showPage('home')">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <h1>Crear Reporte</h1>
        </div>

        <form class="report-form" id="reportForm">
            <div class="form-group">
                <label>Tipo de problema</label>
                <select id="problemType" required>
                    <option value="pothole">Calles rotas</option>
                    <option value="streetlight">Luz rota</option>
                    <option value="trash">Basura</option>
                    <option value="broken_pipes">Caños rotos</option>
                    <option value="curb_and_gutter">Cordon despintado</option>

                </select>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea id="description" required></textarea>
            </div>

            <div class="form-group">
                <label>Ubicación</label>
                <input type="text" id="location" required>
            </div>

            <div class="form-group file-upload">
                <label class="file-upload-label">
                    <i class="fas fa-upload"></i>
                    Subir foto
                    <input type="file" id="photo">
                </label>
            </div>

            <div id="photoPreview" class="photo-preview"></div>

            <button class="btn btn-primary btn-full" type="submit">
                Enviar Reporte
            </button>
        </form>
    </div>

    <!-- MAP PAGE -->
    <div id="reports-map" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showPage('home')">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>Mapa de Reportes</h1>
        </div>

        <div class="map-page-content">
            <div class="sidebar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="mapSearch" placeholder="Buscar...">
                </div>

                <div class="reports-list" id="mapReportsList"></div>
            </div>

            <div class="map-area">
                <div class="map-container">
                    <div class="map-placeholder-large">
                        <i class="fas fa-map"></i>
                        <h3>Mapa (simulado)</h3>
                        <p>Acá iría Google Maps o similar</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin-dashboard" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="showPage('home')">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>Panel Admin</h1>
        </div>

        <div class="admin-controls">
            <input type="text" id="adminSearch" placeholder="Buscar...">
            
            <select id="statusFilter">
                <option value="">Todos</option>
                <option value="pending">Pendiente</option>
                <option value="in-progress">En progreso</option>
                <option value="resolved">Resuelto</option>
            </select>
        </div>

        <div class="table-container">
            <table class="admin-table">
                <thead>
                    <tr> 
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Tipo</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- JS -->
<script src="../js/index.js"></script>

</body>
</html>
