<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Registro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <!-- Navbar se cargará dinámicamente -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>CiudadActiva</h1>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <!-- Los links se cargarán dinámicamente -->
            </ul>
        </div>
    </nav>

    <main>
        <div class="register-container">
            <div class="register-card">
                <div class="register-header">
                    <h2>Crear Cuenta</h2>
                    <p>Únete a CiudadActiva y mejora tu ciudad</p>
                </div>
                <div class="register-body">
                    <div id="alertContainer"></div>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">Usuario</label>
                            <input type="text" id="username" name="username" required placeholder="Elige un usuario" minlength="3">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required placeholder="Crea una contraseña" minlength="6">
                            <div id="passwordStrength" class="password-strength"></div>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirma tu contraseña">
                        </div>
                        <button type="submit" class="btn-register">Registrarse</button>
                    </form>
                    <div class="register-footer">
                        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 CiudadActiva - Mejorando Río Tercero</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
