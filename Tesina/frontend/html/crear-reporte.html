<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Crear Reporte</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reporte.css">
</head>
<body>
    <!-- Navbar se cargará dinámicamente -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>CiudadActiva</h1>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <!-- Los links se cargarán dinámicamente -->
            </ul>
        </div>
    </nav>

    <main>
        <div class="report-container">
            <div class="report-card">
                <div class="report-header">
                    <h2>Reportar Problema Urbano</h2>
                    <p>Ayúdanos a mejorar Río Tercero</p>
                </div>
                <div class="report-body">
                    <form id="reportForm">
                        <div class="form-group">
                            <label for="problemType">Tipo de problema *</label>
                            <select id="problemType" name="problemType" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="calle_rota">Calle rota / Bache</option>
                                <option value="basura">Acumulación de basura</option>
                                <option value="luminaria">Luminaria rota</option>
                                <option value="caño_roto">Caño roto / Fuga de agua</option>
                                <option value="cordon">Cordón despintado / Dañado</option>
                                <option value="otro">Otro problema</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="title">Título (opcional)</label>
                            <input type="text" id="title" name="title" placeholder="Ej: Bache peligroso en esquina">
                        </div>

                        <div class="form-group">
                            <label for="description">Descripción detallada *</label>
                            <textarea id="description" name="description" rows="4" required placeholder="Describe el problema con detalle..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="location">Ubicación *</label>
                            <input type="text" id="location" name="location" required placeholder="Ej: Calle San Martín 123, entre Av. Argentina y Belgrano">
                            <small class="help-text">Incluye referencias para encontrar fácilmente el lugar</small>
                        </div>

                        <div class="form-group">
                            <label for="photo">Fotografía (opcional, máximo 5MB)</label>
                            <input type="file" id="photo" name="photo" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
                            <div id="photoPreview" class="photo-preview"></div>
                            <small class="help-text">Formatos permitidos: JPG, PNG, GIF, WEBP</small>
                        </div>

                        <button type="submit" class="btn-submit">Enviar Reporte</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 CiudadActiva - Mejorando Río Tercero</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/reporte.js"></script>
</body>
</html>
