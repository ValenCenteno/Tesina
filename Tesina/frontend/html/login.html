<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Navbar se cargará dinámicamente -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>CiudadActiva</h1>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <!-- Los links se cargarán dinámicamente -->
            </ul>
        </div>
    </nav>

    <main>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Bienvenido</h2>
                    <p>Inicia sesión para reportar problemas urbanos</p>
                </div>
                <div class="login-body">
                    <div id="alertContainer"></div>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Usuario</label>
                            <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                        </div>
                        <button type="submit" class="btn-login">Iniciar Sesión</button>
                    </form>
                    <div class="login-footer">
                        <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 CiudadActiva - Mejorando Río Tercero</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
