<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login y Registro - Reporte Río Tercero</title>
  <link rel="stylesheet" href="../css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <i class="fas fa-map-marker-alt"></i>
        <h1>Reporte Río Tercero</h1>
        <p>Reporta problemas en tu ciudad</p>
      </div>
      
      <div class="card-body">
        <div class="tabs">
          <button class="tab active" data-tab="login">Iniciar Sesión</button>
          <button class="tab" data-tab="register">Registrarse</button>
        </div>

        <!-- Panel de Login -->
        <div id="loginPanel" class="form-panel active">
          <form id="loginForm">
            <div class="form-group">
              <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
              <div class="input-group">
                <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required>
              </div>
            </div>
            <div class="form-group">
              <label><i class="fas fa-lock"></i> Contraseña</label>
              <div class="input-group">
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
              </div>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
            <div class="footer-links">
              <a href="#" data-tab="register">¿No tienes cuenta? Regístrate</a>
            </div>
          </form>
        </div>

        <!-- Panel de Registro -->
        <div id="registerPanel" class="form-panel">
          <form id="registerForm">
            <div class="form-group">
              <label><i class="fas fa-user"></i> Nombre Completo</label>
              <div class="input-group">
                <input type="text" id="registerNombre" placeholder="Tu nombre completo" required>
              </div>
            </div>
            <div class="form-group">
              <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
              <div class="input-group">
                <input type="email" id="registerEmail" placeholder="correo@ejemplo.com" required>
              </div>
            </div>
            <div class="form-group">
              <label><i class="fas fa-lock"></i> Contraseña</label>
              <div class="input-group">
                <input type="password" id="registerPassword" placeholder="Mínimo 4 caracteres" required>
                <i class="fas fa-eye toggle-password" data-target="registerPassword"></i>
              </div>
            </div>
            <div class="form-group">
              <label><i class="fas fa-check-circle"></i> Confirmar Contraseña</label>
              <div class="input-group">
                <input type="password" id="registerConfirmPassword" placeholder="Repite tu contraseña" required>
                <i class="fas fa-eye toggle-password" data-target="registerConfirmPassword"></i>
              </div>
            </div>
            <button type="submit" class="btn">Crear Cuenta</button>
            <div class="footer-links">
              <a href="#" data-tab="login">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/login.js"></script>
</body>
</html>
