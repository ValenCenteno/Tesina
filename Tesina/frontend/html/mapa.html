<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Mapa de Reportes</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/mapa.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        
        <nav class="nav-links" id="navLinks">
            <a href="../html/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/crear-reporte.html" class="btn btn-outline">Reportar</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/admin.html" class="btn btn-outline">Admin</a>
            <button class="btn btn-outline" id="loginBtn">Iniciar Sesión</button>
            <button class="btn btn-primary" id="registerBtn">Registro</button>
        </nav>
        
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Mapa de Reportes</h1>
    </div>

    <div class="map-page-content">
        <div class="sidebar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="mapSearch" placeholder="Buscar...">
            </div>
            <div class="reports-list" id="mapReportsList"></div>
        </div>
        <div class="map-area">
            <div class="map-container">
                <div class="map-placeholder-large">
                    <i class="fas fa-map"></i>
                    <h3>Mapa (simulado)</h3>
                    <p>Acá iría Google Maps o similar</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/mapa.js"></script>

<script>

const hamburger =
    document.getElementById('hamburger');

const navLinks =
    document.getElementById('navLinks');

hamburger.addEventListener('click', () => {

    navLinks.classList.toggle('active');

});

</script>
</body>
</html>
