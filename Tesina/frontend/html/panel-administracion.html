<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Río Tercero</title>
  <link rel="stylesheet" href="../css/index.css ">
  <link rel="stylesheet" href="..css/panel-administracion.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <i class="fas fa-map-marker-alt"></i> Reporte
      </a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="reportes-mapa.html">Mapa de Reportes</a>
        <a href="panel-administracion.html" class="active">Panel de Administración</a>
      </nav>
      <div class="header-actions">
        <a href="dashboard.html" class="btn btn-primary btn-sm">Crear reporte</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="volver-inicio">
        <a href="index.html">
          <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
      </div>
      
      <h1 class="page-title">Panel de Administración</h1>

      <div class="table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Título</th>
              <th>Tipo</th>
              <th>Ubicación</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <tr>
              <td colspan="7" style="text-align: center;">Cargando reportes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
  <script>
    const API_URL_ADMIN = 'http://localhost:3000/api';
    
    // Cargar reportes reales del backend
    function cargarReportes() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('adminTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center;">Debes iniciar sesión como administrador</td></tr>';
        return;
      }

      fetch(API_URL_ADMIN + '/reportes', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => r.json())
      .then(reportes => {
        if (reportes.error) {
          document.getElementById('adminTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center;">' + reportes.error + '</td></tr>';
          return;
        }
        
        const tbody = document.getElementById('adminTableBody');
        if (reportes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay reportes aún</td></tr>';
          return;
        }
        
        tbody.innerHTML = reportes.map(r => `
          <tr data-id="${r.id}">
            <td>${r.id}</td>
            <td>${r.usuario_nombre || 'Anónimo'}</td>
            <td>${r.titulo}</td>
            <td>${r.tipo}</td>
            <td class="text-muted">${r.direccion}</td>
            <td>
              <span class="badge ${getBadgeClass(r.estado)}">${getEstadoTexto(r.estado)}</span>
            </td>
            <td>
              <select class="status-select" data-id="${r.id}" onchange="cambiarEstado(${r.id}, this.value)">
                <option value="pendiente" ${r.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="en progreso" ${r.estado === 'en progreso' ? 'selected' : ''}>En Progreso</option>
                <option value="resuelto" ${r.estado === 'resuelto' ? 'selected' : ''}>Resuelto</option>
              </select>
              <button class="btn-icon btn-delete" onclick="eliminarReporte(${r.id})">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        `).join('');
      })
      .catch(() => {
        // Modo demo
        mostrarReportesDemo();
      });
    }
    
    function mostrarReportesDemo() {
      const reportesDemo = [
        { id: 1, usuario_nombre: 'Juan Pérez', titulo: 'Calle con baches', tipo: 'Baches', direccion: 'Av. Sabattini 450', estado: 'pendiente' },
        { id: 2, usuario_nombre: 'Ana Rodríguez', titulo: 'Luminaria rota', tipo: 'Luminaria rota', direccion: 'Av. San Martín 800', estado: 'en progreso' },
        { id: 3, usuario_nombre: 'Luis López', titulo: 'Acumulación de basura', tipo: 'Basura', direccion: 'Barrio Sur, calle 9 de Julio', estado: 'pendiente' },
      ];
      
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = reportesDemo.map(r => `
        <tr data-id="${r.id}">
          <td>${r.id}</td>
          <td>${r.usuario_nombre}</td>
          <td>${r.titulo}</td>
          <td>${r.tipo}</td>
          <td class="text-muted">${r.direccion}</td>
          <td>
            <span class="badge ${getBadgeClass(r.estado)}">${getEstadoTexto(r.estado)}</span>
          </td>
          <td>
            <select class="status-select" data-id="${r.id}" onchange="cambiarEstadoDemo(${r.id}, this.value)">
              <option value="pendiente" ${r.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
              <option value="en progreso" ${r.estado === 'en progreso' ? 'selected' : ''}>En Progreso</option>
              <option value="resuelto" ${r.estado === 'resuelto' ? 'selected' : ''}>Resuelto</option>
            </select>
            <button class="btn-icon btn-delete" onclick="eliminarReporteDemo(${r.id})">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }
    
    function getBadgeClass(estado) {
      switch(estado) {
        case 'pendiente': return 'badge-warning';
        case 'en progreso': return 'badge-primary';
        case 'resuelto': return 'badge-success';
        default: return 'badge-warning';
      }
    }
    
    function getEstadoTexto(estado) {
      switch(estado) {
        case 'pendiente': return 'Pendiente';
        case 'en progreso': return 'En progreso';
        case 'resuelto': return 'Resuelto';
        default: return estado;
      }
    }
    
    // Cambiar estado en backend real
    function cambiarEstado(id, nuevoEstado) {
      const token = localStorage.getItem('token');
      if (token) {
        fetch(`${API_URL_ADMIN}/reportes/${id}/estado`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token 
          },
          body: JSON.stringify({ estado: nuevoEstado })
        })
        .then(r => r.json())
        .then(data => {
          showToast('Estado actualizado correctamente', 'success');
          // Actualizar badge visualmente
          const row = document.querySelector(`tr[data-id="${id}"]`);
          if (row) {
            const badge = row.querySelector('.badge');
            if (badge) {
              badge.className = 'badge ' + getBadgeClass(nuevoEstado);
              badge.textContent = getEstadoTexto(nuevoEstado);
            }
          }
        })
        .catch(() => {
          showToast('Error al actualizar estado (modo demo)', 'error');
          cambiarEstadoDemo(id, nuevoEstado);
        });
      } else {
        cambiarEstadoDemo(id, nuevoEstado);
      }
    }
    
    function cambiarEstadoDemo(id, nuevoEstado) {
      const row = document.querySelector(`tr[data-id="${id}"]`);
      if (row) {
        const badge = row.querySelector('.badge');
        if (badge) {
          badge.className = 'badge ' + getBadgeClass(nuevoEstado);
          badge.textContent = getEstadoTexto(nuevoEstado);
        }
        showToast('Estado actualizado (modo demo)', 'success');
      }
    }
    
    // Eliminar reporte
    function eliminarReporte(id) {
      if (!confirm('¿Estás seguro de que quieres eliminar este reporte?')) return;
      
      const token = localStorage.getItem('token');
      if (token) {
        fetch(`${API_URL_ADMIN}/reportes/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.json())
        .then(data => {
          showToast('Reporte eliminado correctamente', 'success');
          // Eliminar fila de la tabla
          const row = document.querySelector(`tr[data-id="${id}"]`);
          if (row) row.remove();
        })
        .catch(() => {
          showToast('Error al eliminar (modo demo)', 'error');
          eliminarReporteDemo(id);
        });
      } else {
        eliminarReporteDemo(id);
      }
    }
    
    function eliminarReporteDemo(id) {
      const row = document.querySelector(`tr[data-id="${id}"]`);
      if (row) {
        row.remove();
        showToast('Reporte eliminado (modo demo)', 'success');
      }
    }
    
    // Cargar reportes al iniciar
    document.addEventListener('DOMContentLoaded', cargarReportes);
  </script>
</body>
</html>
