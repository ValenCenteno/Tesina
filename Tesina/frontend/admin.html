<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Río Tercero</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <i class="fas fa-map-marker-alt"></i> Reporte
      </a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="reportes-mapa.html">Mapa de Reportes</a>
        <a href="panel-administracion.html">Panel de Administración</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h2>Acceso Administrador</h2>
      <p class="auth-subtitle">Ingresa con tus credenciales de administrador</p>
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="adminEmail">Correo electrónico</label>
          <input type="email" id="adminEmail" placeholder="admin@riotercero.gob.ar" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Contraseña</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
      </form>
      <p class="auth-hint">Credenciales demo: admin@riotercero.gob.ar / admin123</p>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      
      // Intentar con backend
      fetch('http://localhost:3000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.token && data.user.rol === 'admin') {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showToast('Acceso concedido', 'success');
          setTimeout(() => window.location.href = 'panel-administracion.html', 1000);
        } else if (data.token) {
          showToast('No tienes permisos de administrador', 'error');
        } else {
          showToast(data.error || 'Credenciales inválidas', 'error');
        }
      })
      .catch(() => {
        // Modo demo sin backend
        if (email === 'admin@riotercero.gob.ar' && password === 'admin123') {
          showToast('Acceso concedido (modo demo)', 'success');
          setTimeout(() => window.location.href = 'panel-administracion.html', 1000);
        } else {
          showToast('Credenciales inválidas', 'error');
        }
      });
    }
  </script>
</body>
</html>
