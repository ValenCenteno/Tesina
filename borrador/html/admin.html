<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiudadActiva - Panel Admin</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        <nav class="nav-buttons">
            <a href="../html/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/crear-reporte.html" class="btn btn-outline">Reportar</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/admin.html" class="btn btn-outline">Admin</a>
            <button class="btn btn-outline" id="loginBtn">Iniciar Sesión</button>
            <button class="btn btn-primary" id="registerBtn">Registro</button>
        </nav>
        <button class="btn-mobile-toggle" id="mobileToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <a href="../html/index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Panel Admin</h1>
    </div>

    <div class="admin-controls">
        <input type="text" id="adminSearch" placeholder="Buscar...">
        <select id="statusFilter">
            <option value="">Todos</option>
            <option value="pending">Pendiente</option>
            <option value="in-progress">En progreso</option>
            <option value="resolved">Resuelto</option>
        </select>
    </div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
                <tr><th>ID</th><th>Usuario</th><th>Tipo</th><th>Ubicación</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>
</main>

<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
