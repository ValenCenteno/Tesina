<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Reporte</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

<header>
  <div class="logo">Reporte</div>
</header>

<section class="form-section">

  <h2>Reportar un problema</h2>

  <div class="form-container">

    <!-- FORMULARIO -->
    <form class="form">
      <label>Título</label>
      <input type="text" placeholder="Ej: Calle rota">

      <label>Descripción</label>
      <textarea placeholder="Describe el problema, ubicación, etc..."></textarea>

      <label>Tipo de problema</label>
      <textarea placeholder="Escribe el problema..."></textarea>
      
      <button class="btn">Enviar reporte</button>
    </form>

    <!-- MAPA REAL -->
    <div class="map">
      <iframe 
        src="https://www.google.com/maps?q=Rio+Tercero,Cordoba,Argentina&output=embed"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </div>

  </div>

</section>

</body>
</html>
