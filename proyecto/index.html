<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte Ciudad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo">Reporte</div>
  <div class="nav">
    <button class="btn">Iniciar sesión</button>
    <button class="btn-outline">Registrarse</button>
  </div>
</header>

<section class="hero">
  <img class="hero-img" src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Banderario3.jpg">

  <div class="overlay">
    <h1>Reporta Problemas en tu Ciudad</h1>
    <p>Ayuda a mejorar Río Tercero</p>
  </div>
</section>

<section class="cards">
  <h2>Problemas recientes</h2>

  <div class="card-container">
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1597764690523-15bea4c581c9">
      <h3>Calle con baches</h3>
      <p>Baches peligrosos en la vía pública</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1581092918056-0c4c3acd3789" alt="">
      <h3>Luminaria rota</h3>
      <p>Falta de iluminación nocturna</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1604187351574-c75ca79f5807" alt="">
      <h3>Basura acumulada</h3>
      <p>Residuos sin recolectar</p>
    </div>

  </div>

  <button class="btn center">Ver todos los reportes</button>
</section>

</body>
</html>
