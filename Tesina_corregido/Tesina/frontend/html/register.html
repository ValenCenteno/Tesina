<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Registro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        <nav class="nav-links" id="navLinks">
            <a href="../html/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/login.html" class="btn btn-outline">Iniciar Sesión</a>
        </nav>
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h2>Crear Cuenta</h2>
                <p>Uníte a CiudadActiva y mejorá tu ciudad</p>
            </div>
            <div class="register-body">
                <div id="alertContainer"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required
                               placeholder="Elegí un nombre de usuario" minlength="3"
                               autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required
                               placeholder="Creá una contraseña (mín. 6 caracteres)" minlength="6"
                               autocomplete="new-password">
                        <div id="passwordStrength" class="password-strength"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                               placeholder="Repetí tu contraseña" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-register">Registrarse</button>
                </form>
                <div class="register-footer">
                    <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>

    const hamburger = document.getElementById('hamburger');
    const navLinks  = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        const icon = hamburger.querySelector('i');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
    });
</script>
</body>
</html>
