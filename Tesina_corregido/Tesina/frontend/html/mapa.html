<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CiudadActiva - Mapa de Reportes</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/mapa.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <i class="fas fa-city"></i> CiudadActiva
        </div>
        <nav class="nav-links" id="navLinks">
            <a href="../html/index.html" class="btn btn-outline">Inicio</a>
            <a href="../html/mapa.html" class="btn btn-outline">Mapa</a>
            <a href="../html/crear-reporte.html" id="reportLink" class="btn btn-outline" style="display:none">Reportar</a>
            <a href="../html/admin.html" id="adminLink" class="btn btn-outline" style="display:none">Admin</a>

            <button class="btn btn-outline" id="loginBtn">Iniciar Sesión</button>
            <button class="btn btn-primary" id="registerBtn">Registro</button>

            <div id="userMenu" style="display:none; align-items:center; gap:10px;">
                <span id="usernameDisplay" class="navbar-username"></span>
                <button class="btn btn-outline" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </nav>
        <button class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <a href="../html/index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <h1>Mapa de Reportes</h1>
    </div>

    <div class="map-page-content">

        
        <div class="sidebar">
            <p class="sidebar-title">Reportes activos</p>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="mapSearch" placeholder="Buscar por título o ubicación...">
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-status="">Todos</button>
                <button class="filter-btn" data-status="pendiente">Pendiente</button>
                <button class="filter-btn" data-status="en_proceso">En proceso</button>
                <button class="filter-btn" data-status="resuelto">Resuelto</button>
            </div>

            <div class="reports-list" id="mapReportsList">
                <div class="list-empty">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <p>Cargando reportes...</p>
                </div>
            </div>
        </div>

        
        <div class="map-area">
            <div id="map"></div>
        </div>

    </div>
</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/mapa.js"></script>

<script>
    const hamburger = document.getElementById('hamburger');
    const navLinks  = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        const icon = hamburger.querySelector('i');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
    });
</script>
</body>
</html>
